services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: git-review
    container_name: git-review
    restart: unless-stopped
    ports:
      - "3456:3000"
    env_file: .env.local
    environment:
      - NODE_ENV=production
    volumes:
      - /mnt/storage:/mnt/storage
      - /DATA:/DATA